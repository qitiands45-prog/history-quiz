<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141516">
  <meta name="description" content="24道日常选择，从性格与处事习惯里，遇见与你相似的历史人物。一位主匹配与两位相近人物，打开就能测。">
  <meta name="color-scheme" content="dark">
  <title>你最像历史上哪个“奸”臣？</title>
  <style>:root {
  color-scheme: dark;
  --bg: #141516;
  --panel: #1c1d1f;
  --panel-raised: #222326;
  --panel-inset: #17181a;
  --text: #e9e6e0;
  --muted: #b0ada7;
  --faint: #8f8d88;
  --gold: #b9a16e;
  --gold-strong: #c6ad79;
  --gold-soft: rgba(185, 161, 110, .1);
  --line: #363638;
  --line-gold: #5b503b;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}

* { box-sizing: border-box; }
html { min-width: 0; background: var(--bg); scroll-padding-top: 24px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.75 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
button:focus-visible, a:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold-strong); outline-offset: 4px; }
a { color: var(--gold-strong); text-underline-offset: 4px; overflow-wrap: anywhere; }
img, svg, canvas { max-width: 100%; }
h1, h2, h3, h4, p { margin-top: 0; }
h1, h2, h3 { font-weight: 500; }
::selection { background: #665538; color: #fff; }
[hidden], .hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; padding: 0; border: 0; clip: rect(0, 0, 0, 0); white-space: nowrap; }
.skip-link { position: fixed; top: -100px; left: 16px; z-index: 100; padding: 10px 18px; border-radius: 6px; background: var(--text); color: var(--bg); }
.skip-link:focus { top: 12px; }
.noscript-note { max-width: 620px; margin: 48px auto; padding: 24px; border: 1px solid var(--line); }

.site-header { width: min(1040px, calc(100% - 64px)); min-height: 100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; min-width: 0; }
button.brand { background: transparent; border: 0; padding: 0; text-align: left; }
.brand-seal { width: 37px; height: 37px; border: 1px solid var(--line-gold); display: grid; place-items: center; flex: 0 0 auto; font: 22px/1 var(--serif); color: var(--gold); }
.brand-text { font: 17px/1.5 var(--serif); letter-spacing: .12em; }
.brand-text small { display: block; font: 9px/1.7 var(--sans); letter-spacing: .18em; color: var(--faint); }
.header-meta { color: var(--faint); font-size: 11px; letter-spacing: .16em; text-align: right; }
.text-button { min-height: 44px; padding: 8px 2px; background: transparent; color: var(--muted); border: 0; font-size: 13px; text-decoration: underline; text-decoration-color: var(--line-gold); text-underline-offset: 5px; }
.text-button:hover { color: var(--gold-strong); }
.page { width: min(1040px, calc(100% - 64px)); margin: 0 auto; padding: 44px 0 52px; min-width: 0; }

.cover-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: center; gap: 64px; padding: 23px 0 40px; }
.cover-main { min-width: 0; }
.eyebrow, .section-label { display: block; margin-bottom: 24px; font-size: 11px; line-height: 1.6; font-weight: 500; letter-spacing: .2em; color: var(--gold); }
.eyebrow::before { content: ""; display: inline-block; width: 27px; height: 1px; background: var(--gold); vertical-align: middle; margin-right: 12px; }
.eyebrow > .tiny-line { display: none; }
.hero-title { font-family: var(--serif); font-size: clamp(42px, 5vw, 64px); line-height: 1.35; letter-spacing: .04em; margin-bottom: 25px; font-weight: 500; overflow-wrap: break-word; }
.accent { color: var(--gold-strong); }
.lede { max-width: 30em; font-size: 17px; line-height: 1.9; color: var(--muted); margin-bottom: 26px; }
.cover-aside { position: relative; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
.ornament { width: 100%; min-height: 74px; display: flex; align-items: center; justify-content: center; gap: 15px; color: var(--gold); }
.ornament-word { flex-shrink: 0; font: 38px/1.3 var(--serif); letter-spacing: .2em; }
.ornament-caption { color: var(--faint); font: 10px/1.9 var(--sans); letter-spacing: .15em; }
.ornament-line { height: 1px; width: 34px; background: var(--line-gold); }
.cover-aside > p, .cover-aside > small { margin: 0; color: var(--faint); font-size: 12px; letter-spacing: .2em; }
.cover-statistics { display: flex; align-items: stretch; gap: 0; margin: 26px 0; color: var(--muted); }
.stat { flex: 1 1 0; min-width: 0; padding: 0 20px; border-left: 1px solid var(--line); font-size: 12px; }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat strong { display: block; color: var(--text); font: 28px/1.3 Georgia, var(--serif); font-weight: 400; margin-bottom: 5px; }
.stat span { display: block; }
.entry-panel { width: 100%; min-width: 0; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.entry-panel > .section-label { margin-bottom: 12px; }
.entry-panel > p { color: var(--muted); font-size: 14px; margin-bottom: 15px; }
.segmented { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 4px; background: var(--panel-inset); border: 1px solid var(--line); padding: 4px; border-radius: 7px; margin-bottom: 18px; }
.segment { min-height: 44px; padding: 8px 6px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--muted); font-size: 14px; line-height: 1.5; }
.segment small { display: block; margin-top: 3px; font: 10px/1.4 var(--sans); color: var(--faint); }
.segment.active small { color: #bdb096; }
.segment.active, .segment[aria-pressed="true"], .segment[aria-selected="true"] { background: #333129; border-color: #5b503b; color: #e8d4a8; }
.primary-button, .secondary-button { min-height: 52px; padding: 13px 24px; border-radius: 6px; line-height: 1.55; font-size: 16px; font-weight: 500; letter-spacing: .03em; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 12px; }
.primary-button { background: var(--gold); color: #1b1914; border: 1px solid var(--gold); }
.primary-button:hover:not(:disabled) { background: #c9b17d; border-color: #c9b17d; }
.secondary-button { background: transparent; color: var(--text); border: 1px solid #59564e; }
.secondary-button:hover:not(:disabled) { border-color: var(--gold); background: var(--gold-soft); }
.primary-button:disabled, .secondary-button:disabled { background: #27282a; border-color: #3a3b3d; color: #969690; opacity: 1; }
.start-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 22px; }
.start-actions > .primary-button { flex: 1 1 200px; }
.start-actions > .secondary-button { flex: 1 1 auto; }
.start-actions > .text-button { flex: 1 0 100%; min-height: 36px; }
.entry-note { margin-top: 17px; text-align: center; color: var(--faint); font-size: 11px; line-height: 1.8; }
.cover-bottom { margin-top: 8px; }
.caption-note { color: var(--muted); font-size: 12px; margin-bottom: 0; }
.microcopy { margin: 14px 0 0; font-size: 12px; line-height: 1.8; color: var(--muted); }
.intro-note { margin: 22px 0 0; color: #c0bdb5; font-size: 14px; padding-left: 14px; border-left: 1px solid var(--line-gold); }
.footnote { margin: 27px 0 0; color: var(--faint); font-size: 12px; line-height: 1.8; }
footer.footnote { width: min(1040px, calc(100% - 64px)); margin: 8px auto 0; padding: 23px 0 max(32px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
footer.footnote p { margin-bottom: 7px; }
footer.footnote .text-button { font-size: 12px; }
.footer-dot { margin: 0 7px; }
.method-box { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.method-box p:last-child { margin-bottom: 0; }
.method-box > summary { font-size: 14px; }
.method-box ol, .method-box ul { padding-left: 22px; }
.method-box li + li { margin-top: 8px; }

.quiz-shell { max-width: 660px; margin: 0 auto; padding-bottom: 12px; }
.question-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.question-top .microcopy { margin: 0; font-size: 11px; text-align: right; }
.progress-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 13px; }
.progress-meta strong { color: var(--gold); font-weight: 500; }
.progress-track { height: 3px; background: #353536; overflow: hidden; border-radius: 3px; }
.progress-fill { height: 100%; background: var(--gold); border-radius: inherit; }
.question-area { margin-top: 34px; }
.question-number { display: block; font: 12px/1.6 var(--sans); color: var(--gold); letter-spacing: .18em; margin-bottom: 14px; }
.question-title { font: 28px/1.65 var(--serif); letter-spacing: .02em; margin-bottom: 13px; overflow-wrap: break-word; }
.question-hint { color: var(--muted); font-size: 14px; line-height: 1.8; margin-bottom: 26px; }
.options { display: grid; gap: 12px; margin: 24px 0 28px; padding: 0; list-style: none; }
.option { position: relative; width: 100%; min-height: 76px; display: flex; align-items: flex-start; gap: 16px; padding: 18px 21px; border: 1px solid #434346; background: var(--panel); color: var(--text); border-radius: 8px; text-align: left; line-height: 1.75; }
.option:hover { border-color: #82775f; background: #222221; }
.option-letter { display: grid; place-items: center; flex: 0 0 28px; width: 28px; height: 28px; margin-top: 1px; border: 1px solid #585858; border-radius: 50%; color: #b9b7b1; font: 13px/1 Georgia, serif; }
.option-copy { flex: 1; min-width: 0; padding-right: 3px; }
.option-check { flex: 0 0 15px; padding-top: 2px; color: var(--gold-strong); font-size: 16px; line-height: 1.5; }
.option.is-selected, .option[aria-checked="true"], .option[aria-pressed="true"] { border-color: var(--gold); background: #29271f; box-shadow: inset 0 0 0 1px rgba(185,161,110,.16); }
.option.is-selected .option-letter, .option[aria-checked="true"] .option-letter, .option[aria-pressed="true"] .option-letter { background: var(--gold); border-color: var(--gold); color: #171714; font-weight: 700; }
.quiz-actions { position: sticky; bottom: 0; z-index: 4; display: grid; grid-template-columns: minmax(94px, .35fr) minmax(0, 1fr); gap: 12px; padding: 18px 0 max(16px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(20,21,22,0), var(--bg) 16px); }
.quiz-actions .primary-button, .quiz-actions .secondary-button { padding-left: 14px; padding-right: 14px; }
.quiz-shell > .footnote { padding-bottom: 8px; margin-top: 10px; }
.question-footnote { margin: 8px 0 0; padding-bottom: 12px; color: var(--faint); text-align: center; font-size: 11px; }
.update-result { text-align: center; }

.result-page { max-width: 820px; }
.result-head { margin-bottom: 28px; }
.result-head .eyebrow { margin-bottom: 14px; }
.result-head > h1 { font: 34px/1.5 var(--serif); margin-bottom: 16px; }
.result-summary { color: #cecbc4; line-height: 1.95; font-size: 16px; margin-bottom: 18px; }
.result-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--faint); font-size: 12px; }
.result-meta .text-button { font-size: 12px; }
.notice { margin: 18px 0; padding: 13px 16px; border: 1px solid var(--line-gold); border-radius: 5px; color: #c6bda8; background: rgba(185,161,110,.04); font-size: 13px; line-height: 1.85; }
.match-card { position: relative; overflow: hidden; min-width: 0; padding: 30px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; margin-bottom: 24px; }
.main-match { padding: 34px; border-color: #776344; }
.main-match::before { content: ""; position: absolute; top: 0; left: 28px; right: 28px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 12px; }
.card-top > :first-child { min-width: 0; }
.rank-label { display: block; color: var(--gold); font-size: 11px; line-height: 1.7; letter-spacing: .17em; margin-bottom: 10px; }
.rank-label small { display: block; color: var(--faint); font-size: 10px; margin-top: 7px; letter-spacing: .05em; }
.score-block { flex-shrink: 0; text-align: right; }
.score-value { font: 43px/1.05 Georgia, "Times New Roman", serif; color: var(--gold-strong); white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
.score-value small, .score-value span { font-size: .46em; margin-left: 1px; }
.score-label { display: block; min-height: 32px; padding: 7px 0 0; margin-left: auto; background: transparent; border: 0; color: var(--muted); font-size: 10px; line-height: 1.5; letter-spacing: .06em; }
.match-title { margin: 0 0 8px; font: 37px/1.4 var(--serif); letter-spacing: .07em; }
.identity { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 10px; }
.recognition { color: #c5c1b8; font-size: 14px; line-height: 1.9; margin: 0 0 18px; }
.tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 17px 0 23px; padding: 0; list-style: none; }
.tag { font-size: 12px; line-height: 1.6; padding: 4px 10px; color: #ceb98f; border: 1px solid #554c3d; border-radius: 3px; background: rgba(185,161,110,.035); }
.portrait { color: #d4d0c8; line-height: 1.95; margin-bottom: 24px; font-size: 15px; }
.data-note { padding: 11px 13px; margin: 0 0 20px; background: #25231e; border: 1px solid #484131; color: #c1b79f; font-size: 12px; border-radius: 4px; }
.match-card h3 { font-size: 14px; color: var(--text); margin: 24px 0 13px; font-weight: 500; letter-spacing: .03em; }
.evidence-list { padding: 0; margin: 0 0 20px; display: grid; gap: 12px; list-style: none; }
.evidence-item { padding: 14px 16px; background: var(--panel-inset); border-left: 2px solid #716044; border-radius: 0 5px 5px 0; color: #ccc8bf; font-size: 14px; line-height: 1.9; }
.evidence-item p { margin: 0; }
.evidence-item p + p { margin-top: 9px; }
.evidence-dimension { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: var(--gold); font-size: 11px; letter-spacing: .04em; margin-bottom: 7px; }
.evidence-dimension strong { font-weight: 500; }
.evidence-index { color: #938161; font: 12px/1.6 Georgia, serif; }
.evidence-kind { margin-left: auto; color: var(--faint); font-size: 10px; letter-spacing: 0; }
.quote { display: block; margin: 8px 0; font-size: 13px; color: var(--muted); line-height: 1.85; }
.quote > span { display: block; margin-bottom: 3px; color: var(--faint); font-size: 11px; }
.historic-parallel { color: #b5afa2; font-size: 12px; line-height: 1.8; }
.historic-parallel b { color: #c6b78e; font-weight: 500; margin-right: 5px; }
.difference { padding-top: 17px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.9; color: #c6c2ba; }
.difference strong { display: block; margin-bottom: 5px; color: var(--text); font-weight: 500; }
.difference h4, .reminder h4 { margin: 0 0 7px; color: var(--text); font-size: 12px; font-weight: 500; letter-spacing: .04em; }
.difference p, .reminder p { margin-bottom: 0; }
.reminder { margin-top: 19px; padding: 16px 18px; border-radius: 5px; background: #292722; color: #d8c8a5; font-size: 14px; line-height: 1.9; }
.reminder strong { display: block; font-weight: 500; font-size: 12px; letter-spacing: .08em; color: var(--gold); margin-bottom: 5px; }
.reminder h4 { color: var(--gold-strong); }
.card-details { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; color: var(--muted); }
details > summary { display: list-item; padding: 10px 0; cursor: pointer; list-style: none; line-height: 1.7; color: var(--muted); min-height: 44px; }
details > summary::-webkit-details-marker { display: none; }
details > summary > span[aria-hidden="true"] { display: none; }
details > summary::after { content: "+"; float: right; color: var(--gold); padding-left: 12px; font-size: 18px; line-height: 1.2; }
details[open] > summary::after { content: "−"; }
details > summary:hover { color: var(--text); }
details[open] > summary { margin-bottom: 8px; }
.card-details p { margin-bottom: 12px; }
.details-body { padding-top: 8px; }
.historic-dimension { padding: 15px 0; border-top: 1px solid var(--line); }
.historic-dimension h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 0 0 9px; color: var(--text); font-size: 13px; font-weight: 500; }
.historic-dimension h4 span { color: var(--gold); font-size: 11px; font-weight: 400; }
.historic-dimension p { font-size: 12px; margin: 0 0 7px; line-height: 1.9; }
.historic-dimension b { font-weight: 500; color: #c2bdb3; }
.historic-dimension .evidence-limit { color: var(--faint); margin-bottom: 0; }
.source-list { margin: 14px 0 0; padding-left: 20px; }
.source-list li { padding: 4px 0; overflow-wrap: anywhere; word-break: break-word; }
.source-list a { color: #c6b78e; }
.section-intro { margin: 35px 0 20px; }
.section-intro .section-label { margin-bottom: 8px; }
.section-intro p { color: var(--muted); font-size: 13px; margin-bottom: 0; }
.more-matches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.more-matches > h2, .more-matches > .section-label { grid-column: 1/-1; margin-bottom: 0; }
.secondary-match { padding: 25px; margin-bottom: 0; }
.secondary-match .match-title { font-size: 29px; letter-spacing: .03em; }
.secondary-match .score-value { font-size: 31px; }
.secondary-match .portrait { font-size: 14px; }
.secondary-match .evidence-item { padding: 12px 13px; font-size: 13px; }
.secondary-match .score-label { max-width: 6em; }
.secondary-match .card-top { gap: 10px; }

.profile-panel { margin: 28px 0; padding: 26px 28px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-inset); }
.profile-panel h2 { font: 23px/1.6 var(--serif); margin-bottom: 8px; }
.profile-panel > p { color: var(--muted); font-size: 13px; margin-bottom: 25px; }
.profile-panel > summary { font: 18px/1.7 var(--serif); color: var(--text); padding: 0; min-height: 31px; }
.profile-inner { padding-top: 10px; }
.profile-inner > .microcopy { margin: 0 0 26px; }
.profile-row { margin: 19px 0; }
.profile-row > strong, .profile-row > label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
.profile-row > div:first-child { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 8px; }
.profile-title b { font-weight: 500; }
.profile-title > span { color: var(--gold); font-size: 11px; text-align: right; }
.profile-track { position: relative; height: 4px; margin: 12px 5px; background: #454440; border-radius: 4px; }
.profile-track::before { content: ""; position: absolute; height: 10px; width: 1px; left: 50%; top: -3px; background: #676256; }
.profile-mark { position: absolute; top: 50%; width: 11px; height: 11px; transform: translate(-50%, -50%); background: var(--gold); border: 2px solid var(--panel-inset); border-radius: 50%; box-shadow: 0 0 0 1px var(--gold); }
.dimension-ends { display: flex; justify-content: space-between; gap: 20px; font-size: 11px; line-height: 1.65; color: var(--muted); }
.dimension-ends > :last-child { text-align: right; }

.share-section { margin-top: 38px; }
.share-section > .section-label { text-align: center; margin-bottom: 18px; }
.share-card { position: relative; width: min(100%, 440px); margin: 0 auto 18px; padding: 28px 28px 24px; border: 1px solid #7c6745; border-radius: 3px; background: #1a1a1b; overflow: hidden; }
.share-card::after { content: ""; position: absolute; inset: 8px; border: 1px solid #363229; pointer-events: none; }
.share-top { display: flex; justify-content: space-between; gap: 15px; color: var(--gold); font-size: 10px; letter-spacing: .16em; margin-bottom: 24px; }
.share-card h2 { font: 20px/1.6 var(--serif); margin: 0 0 16px; letter-spacing: .05em; }
.share-card .rank-label { font-size: 10px; margin-top: 15px; }
.share-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 26px; }
.share-main > div:first-child { min-width: 0; }
.share-label { color: var(--gold); font-size: 10px; letter-spacing: .1em; }
.share-card .share-name { font: 41px/1.3 var(--serif); letter-spacing: .05em; color: var(--text); margin: 8px 0 3px; overflow-wrap: anywhere; }
.share-percent { flex-shrink: 0; padding-bottom: 4px; color: var(--gold-strong); font: 42px/1.1 Georgia, serif; }
.share-percent small { font-size: 18px; margin-left: 2px; }
.share-card .tags { margin: 12px 0 20px; gap: 6px; }
.share-card .tag { font-size: 10px; padding: 3px 7px; }
.share-card > p { font-size: 13px; line-height: 1.9; color: #c8c3b9; }
.share-runners { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; border-top: 1px solid #484135; padding-top: 17px; margin-top: 19px; }
.share-runners > div + div { padding-left: 15px; border-left: 1px solid #484135; }
.share-runners strong { display: block; font: 20px/1.5 var(--serif); margin-bottom: 4px; }

  <script id="quiz-data" type="application/json">{"version":"2026-10-25.3","dimensions":[{"id":"control","name":"决策分配","low":"分工自主","high":"集中统筹","definition":"在负责一件事时，愿意把多少具体决定交给其他参与者。","lowMeaning":"约定边界后，给参与者较多决定空间。","midMeaning":"保留关键决定，同时让参与者处理细节。","highMeaning":"倾向自己把握主要决定，统一流程与安排。","reminders":{"low":"给别人空间时，也把交付标准和需要求助的节点说清楚。","mid":"先说清哪些事一起决定，哪些事可以各自处理，合作会更轻松。","high":"把握关键节点就够了；每一个小决定都由你承担，会让自己很累。"}},{"id":"influence","name":"影响路径","low":"先公开表达","high":"先私下协调","definition":"在提出主张时，更常先公开说明，还是先与关键参与者沟通。","lowMeaning":"先把建议放到公开讨论中，再回应具体顾虑。","midMeaning":"公开表达与事先沟通都会用，顺序随场景调整。","highMeaning":"先了解并协调参与者的顾虑，再公开推进。","reminders":{"low":"直接表达时，留一点空间给还没想好怎么回应的人。","mid":"私下商量过的重要前提，最后记得放回共同讨论中。","high":"私下协调之后，把理由和决定说清楚，避免他人只能猜测。"}},{"id":"horizon","name":"布局跨度","low":"先走下一步","high":"多想几步","definition":"做安排时，主要照顾眼前下一步，还是提前考虑更长的行动序列和替代路线。","lowMeaning":"从最近可行动的一步开始，再用进展决定后续。","midMeaning":"先有一个方向，再把近期的几步安排清楚。","highMeaning":"提前梳理较长的路线、节点和备用选择。","reminders":{"low":"走好眼前一步，也偶尔回头检查它是否仍通向你想去的方向。","mid":"让远期目标给你方向，而不是把每个细节都提前锁死。","high":"为计划留一些空白，变化发生时就不用把整张地图推倒重来。"}},{"id":"adaptation","name":"策略调整","low":"观察后再改","high":"及时换做法","definition":"出现新的可行办法或新信息时，更常延长原方案的观察期，还是较快调整做法。","lowMeaning":"给原来的方法足够时间，以免过早改变。","midMeaning":"先局部试改，保留对原方案的观察。","highMeaning":"出现新的可行办法时，较愿意及时切换或重组。","reminders":{"low":"坚持一个办法时，可以约定一个复盘日期，让等待有明确边界。","mid":"每次调整留下一点记录，才能分清究竟是哪一步带来了变化。","high":"换方法之前，留一点观察窗口，避免把正常磨合误判成路线错误。"}},{"id":"independence","name":"意见独立性","low":"优先形成共识","high":"保留自己判断","definition":"自己的判断与他人期待不同时，会在多大程度上继续表达并采用自己的判断。","lowMeaning":"充分听取意见后，倾向靠近共同认可的方向。","midMeaning":"把自己的判断和他人的建议都纳入最后的选择。","highMeaning":"即便意见不同，也较愿意保留并说明自己的判断。","reminders":{"low":"接受别人的建议之前，先分清自己认同它，还是只想尽快结束分歧。","mid":"把你真正不愿让步的部分说出来，共识会更具体。","high":"坚持判断时也留出被新证据说服的空间，独立不必等于独自承担一切。"}},{"id":"risk","name":"风险接受","low":"保留退路","high":"接受波动","definition":"在基本生活不受影响的前提下，面对收益与结果的不确定性，愿意承受多大的波动。","lowMeaning":"优先选择后果可控、可以退出或回退的做法。","midMeaning":"把较稳的选择与一部分尝试结合起来。","highMeaning":"为一个有吸引力的机会，愿意承受更大的结果波动。","reminders":{"low":"把可控的小尝试单独留出来，谨慎也可以为新机会保留位置。","mid":"提前划好试错额度，到边界时就按原先的约定停下来复盘。","high":"出手之前先写清能承受的代价，把机会和基本生活之间留一道边界。"}}],"questions":[{"id":"q01","dimension":"control","prompt":"四位朋友让你统筹一次短途出行，大家都愿意出力。你会怎样分工？","context":"统筹朋友出行","options":[{"text":"先说好预算和时间，具体行程各自负责。","score":0},{"text":"我定主要节点，其余由负责的人决定。","score":1},{"text":"一起分工，但重要安排都先和我对齐。","score":2},{"text":"我先整理完整行程，再请大家按安排分头落实。","score":3}],"kind":"behavior"},{"id":"q02","dimension":"influence","prompt":"小组对一个安排有分歧，你有自己的建议。大家地位相近，也都有时间沟通。你通常怎么提？","context":"小组意见不合","options":[{"text":"先在群里把想法和理由说清楚，一起讨论。","score":0},{"text":"先公开说核心建议，个别顾虑再单独聊。","score":1},{"text":"先分别了解主要顾虑，再把建议发到群里。","score":2},{"text":"先与分歧最大的几个人谈出初步共识，再公开讨论。","score":3}],"kind":"behavior"},{"id":"q03","dimension":"horizon","prompt":"你准备开始一个可能持续半年的个人项目，只留半小时做起步安排。你会优先看多远？","context":"开始个人项目","options":[{"text":"把最近一步想清楚，后面的安排留给实际进展。","score":0},{"text":"看清大方向，重点安排接下来一两周。","score":1},{"text":"先划出未来一两个月的阶段，再安排眼前。","score":2},{"text":"先粗看半年的主要衔接，再回到第一步。","score":3}],"kind":"behavior"},{"id":"q04","dimension":"adaptation","prompt":"一套时间安排试了一周，有两段时间常被临时事务占用，但整体还能完成。朋友提出另一种安排，你通常会？","context":"调整时间安排","options":[{"text":"再完整观察一段时间，先不急着换。","score":0},{"text":"保留主体，只微调最常受影响的地方。","score":1},{"text":"拿一部分时间试新安排，再逐步调整。","score":2},{"text":"近期就切换试试，重新寻找适合现在的节奏。","score":3}],"kind":"behavior"},{"id":"q05","dimension":"independence","prompt":"小组在两种同样可行的方案中做选择。多数人倾向另一种，你想过后仍更看好自己的方案。你会？","context":"面对多数人的意见","options":[{"text":"采用多数人的选择，把精力放到一起做好。","score":0},{"text":"说一次自己的理由，之后配合共同决定。","score":1},{"text":"保留关键主张，提议找一个双方都能接受的做法。","score":2},{"text":"继续说明依据，争取先比较两种方案再决定。","score":3}],"kind":"behavior"},{"id":"q06","dimension":"risk","prompt":"周末有半天空闲。两个活动花费相当：一个体验稳定，一个可能特别精彩，也可能落空。两边都能随时离开，你会？","context":"选择周末活动","options":[{"text":"半天都安排稳定的活动。","score":0},{"text":"主要安排稳定的活动，留一点时间尝试另一个。","score":1},{"text":"主要尝试不确定的活动，留一点时间给稳定的。","score":2},{"text":"半天都留给不确定的活动，接受可能落空。","score":3}],"kind":"behavior"},{"id":"q07","dimension":"control","prompt":"你负责的一次聚会，请熟悉的朋友帮忙安排一部分，对方一直很靠谱。哪种跟进方式让你更自在？","context":"把期待的聚会交给朋友帮忙","options":[{"text":"具体安排最后都由我确认，我会更踏实。","score":3},{"text":"重要的几处先和我确认，小细节让他决定。","score":2},{"text":"只约好哪些情况要告诉我，其余就交给他。","score":1},{"text":"说清我在意的边界后，就让他自己安排。","score":0}],"kind":"personality"},{"id":"q08","dimension":"influence","prompt":"聊天时，朋友当着几个人的面误会了你的意思。你想把话说明白，通常更愿意？","context":"在朋友面前被误解","options":[{"text":"先分别和相关的人聊清楚，再把误会放到一起说开。","score":3},{"text":"先找当事人单独说清，再向在场的人解释。","score":2},{"text":"当场简短澄清，没说完的细节之后单独聊。","score":1},{"text":"当场把自己的意思说明白，和大家一起说开。","score":0}],"kind":"personality"},{"id":"q09","dimension":"horizon","prompt":"学习一项新技能时，你有同样多的练习时间。接下来一段时间，你更想把重点放在哪里？","context":"学习一项新技能","options":[{"text":"先补未来多个方向都可能用到的基础，近期用不上也可以。","score":3},{"text":"以以后继续进阶的基础为主，搭配眼前练习。","score":2},{"text":"以眼前用得上的练习为主，顺带补一点基础。","score":1},{"text":"先练马上要用的部分，后续需要什么再补。","score":0}],"kind":"behavior"},{"id":"q10","dimension":"adaptation","prompt":"周末出行前，预报新增了降雨可能。原安排仍能进行，也有另一个可行安排，改动不费事。你更倾向？","context":"面对新的周末安排","options":[{"text":"较快换成新安排，按变化重新组织这次出行。","score":3},{"text":"先改一部分，其他安排继续观察。","score":2},{"text":"只微调最容易受影响的一处，保留主体。","score":1},{"text":"先保留原安排，等信息更明确时再决定。","score":0}],"kind":"behavior"},{"id":"q11","dimension":"independence","prompt":"日常穿搭被几位朋友建议换个风格。没有场合要求，你仍喜欢原来的搭配。下次出门你更可能？","context":"自己的穿搭与朋友审美不同","options":[{"text":"照常穿自己喜欢的，审美不同也没关系。","score":3},{"text":"保留最喜欢的搭配，试着改一两个细节。","score":2},{"text":"大体采用朋友的建议，留一点自己的偏好。","score":1},{"text":"换成大家更认可的风格，借他们的眼光试试。","score":0}],"kind":"personality"},{"id":"q12","dimension":"risk","prompt":"你有一小笔专门留作尝试的预算，用完也不影响生活。面对一个结果不确定的新点子，你会怎么用？","context":"使用可承受的尝试预算","options":[{"text":"如果值得，就投入这笔预算，接受可能没有收获。","score":3},{"text":"先投入较大一部分，留下少量余地。","score":2},{"text":"先用一小部分试水，看到反馈后再决定。","score":1},{"text":"把尝试拆得很小，每一步都确认代价可控。","score":0}],"kind":"behavior"},{"id":"q13","dimension":"control","prompt":"和同住的人整理公共空间，大家请你负责统筹。你更倾向怎样做决定？","context":"整理共同生活空间","options":[{"text":"由我先定完整方案，再收集大家想改的地方。","score":3},{"text":"大家提想法，最后由我把主要安排统一起来。","score":2},{"text":"一起定下几个共同规则，分区细节各自决定。","score":1},{"text":"约定不互相影响的边界后，交给各人安排自己的部分。","score":0}],"kind":"behavior"},{"id":"q14","dimension":"influence","prompt":"和几位熟人闲聊时，你想到一个很想分享的看法。要把话题带到这里，你通常会？","context":"在熟人聊天中分享自己的看法","options":[{"text":"先分别和几个人聊一聊，有些共鸣后再一起说。","score":3},{"text":"先和身边一两个人聊，再带进共同话题。","score":2},{"text":"先对大家说个大概，细节留给感兴趣的人单独聊。","score":1},{"text":"直接把想法说给大家听，听到回应再接着聊。","score":0}],"kind":"personality"},{"id":"q15","dimension":"horizon","prompt":"难得有一段不用赶进度的空闲，想到接下来的生活，你的思绪通常会停在哪里？","context":"空闲时自然想到的生活安排","options":[{"text":"会自然想到更长远的方向，连几种可能的走法也想一想。","score":3},{"text":"常会想未来几个月想做什么，彼此怎么接上。","score":2},{"text":"多半想到近一两周，再远先不安排。","score":1},{"text":"先想今天明天怎么过，远一点的事等到了再说。","score":0}],"kind":"personality"},{"id":"q16","dimension":"adaptation","prompt":"搬到新地方后，原来的生活习惯还能保留，但有些地方不太顺。你通常会怎么进入新生活？","context":"进入新环境后的习惯调整","options":[{"text":"愿意较快换个节奏，边过边找舒服的方式。","score":3},{"text":"先调整一两处习惯，觉得合适再多改一点。","score":2},{"text":"尽量保留原来的习惯，只改最不方便的地方。","score":1},{"text":"先按熟悉的节奏过一阵，观察后再考虑改。","score":0}],"kind":"personality"},{"id":"q17","dimension":"independence","prompt":"几位熟悉的人建议你的作品换个风格。你重新比较后，仍觉得原风格更合适，而且没有统一标准。你通常会？","context":"面对作品风格的建议","options":[{"text":"说明自己的表达意图，保留这次原本的风格。","score":3},{"text":"主要保留自己的风格，在次要部分吸收建议。","score":2},{"text":"整体向建议靠近，保留少量自己最在意的部分。","score":1},{"text":"采用大家建议的风格，接受与原本想法不同的方向。","score":0}],"kind":"behavior"},{"id":"q18","dimension":"risk","prompt":"你想私下邀请一位欣赏的人一起做件小事，对方可能答应，也可能婉拒。被拒不会影响原有关系。你通常会？","context":"面对可能被拒绝的邀请","options":[{"text":"直接提出邀请，愿意接受一次没回应或被拒。","score":3},{"text":"会主动邀请，但先把想法缩小一点，试一次短的。","score":2},{"text":"先试探对方有没有兴趣，得到积极回应再正式邀请。","score":1},{"text":"等对方先露出明确意愿，再提出这次邀请。","score":0}],"kind":"personality"},{"id":"q19","dimension":"control","prompt":"你负责汇总一份多人共同完成的材料，各部分质量都已达标。最后你更习惯怎样定稿？","context":"汇总共同完成的材料","options":[{"text":"确认符合共同标准后，尊重各自负责部分的决定。","score":0},{"text":"只协调衔接处，其余请各部分负责人确认。","score":1},{"text":"重要表达统一由我定，细节保留各人的做法。","score":2},{"text":"由我整体通盘确认后定稿，最后的取舍由我负责。","score":3}],"kind":"behavior"},{"id":"q20","dimension":"influence","prompt":"一次讨论中，你的建议没有得到响应。你准备再争取一次，通常会从哪里开始？","context":"再次争取建议被采纳","options":[{"text":"在下一次共同讨论中，把理由讲得更具体。","score":0},{"text":"先公开补充依据，再与仍有顾虑的人单独聊。","score":1},{"text":"先找几位参与者沟通，再带着调整后的建议重提。","score":2},{"text":"先逐步协调关键参与者，形成支持后再正式提出。","score":3}],"kind":"behavior"},{"id":"q21","dimension":"horizon","prompt":"你参与维护的小组最近运转顺利，眼前没有急事。轮到你安排下一步时，你会更关注什么？","context":"安排运转顺利的小组","options":[{"text":"先把下一次活动做好，后面的事到时再看。","score":0},{"text":"把最近几次安排顺好，留意大家的反馈。","score":1},{"text":"梳理接下来一段时间的目标和阶段安排。","score":2},{"text":"提前考虑更长的方向、人员衔接和可能需要的备用安排。","score":3}],"kind":"behavior"},{"id":"q22","dimension":"adaptation","prompt":"资料量变多后，原来的整理方法还能用，但查找开始费时。另一种方法可能更顺手，也需要重新适应。你通常会？","context":"调整沿用的工作方法","options":[{"text":"先继续观察使用情况，暂时沿用原方法。","score":0},{"text":"保留原方法，只借用一处新做法。","score":1},{"text":"挑一部分资料试改，再逐步调整。","score":2},{"text":"近期就整体试用新方法，边用边修整。","score":3}],"kind":"behavior"},{"id":"q23","dimension":"independence","prompt":"和朋友聊一个没有标准答案的话题，大家都持另一种看法。听完理由后，你还是没被说服。你通常会？","context":"聊天时与多数朋友意见不同","options":[{"text":"先顺着共同的看法聊，不急着坚持自己的判断。","score":0},{"text":"说一次自己的理由，之后不再继续争论。","score":1},{"text":"保留主要看法，同时找双方能认同的部分。","score":2},{"text":"把自己的理由继续说清，也接受暂时达不成一致。","score":3}],"kind":"personality"},{"id":"q24","dimension":"risk","prompt":"两项自愿任务投入相当，也都能退出：一项成果较稳定，另一项可能很有成就感，也可能白忙。你会怎样分配精力？","context":"面对一项结果不确定的任务","options":[{"text":"主要接成果稳定的任务。","score":0},{"text":"以稳定任务为主，少量尝试另一项。","score":1},{"text":"以可能很有成就感的任务为主，少量兼顾稳定任务。","score":2},{"text":"集中接可能很有成就感的任务，接受白忙的可能。","score":3}],"kind":"behavior"}],"people":[{"id":"cn_zhao_gao","name":"赵高","group":"china","era":"秦末","role":"秦二世时期的中丞相","recognition":"在秦始皇死后的继承安排与秦二世时期的权力斗争中居于关键位置。","keywords":["把住关键","私下铺路","敢改局面"],"portrait":"赵高的处事线索，是先抓住信息和程序的入口，再推动关键人物站到同一边。他在幕后游说，也会在局势变化时重排安排。这种方式重视掌控，却容易把不同意见当成障碍；他真实经历中的操纵与迫害，正说明控制局面不能替代规则和信任。","profile":{"control":100,"influence":100,"horizon":75,"adaptation":75,"independence":75,"risk":100},"evidence":[{"dimension":"control","score":100,"confidence":"inferred","fact":"《史记》记其任中丞相后，政事大小集中由他决定。","inference":"这一明确的权力集中安排支持决策分配的高端定位。","limitation":"君主专制中的权限不能直接等同现代团队管理。","sourceIds":["cn_zhao_gao_s1"]},{"dimension":"influence","score":100,"confidence":"inferred","fact":"沙丘事件中，他分别说服胡亥和李斯，再共同改变继承安排。","inference":"先协调少数关键人、再让安排生效，属于私下铺路的明显实例。","limitation":"这一秘密政治行动不等于普通生活中的沟通习惯。","sourceIds":["cn_zhao_gao_s1"]},{"dimension":"horizon","score":75,"confidence":"inferred","fact":"推动胡亥继位后，他又建议撤换旧臣并安插亲信。","inference":"行动具有接续步骤：取得地位后继续巩固人事基础。","limitation":"这是危机中的政治连锁行动，不能证明一生都擅长长期计划。","sourceIds":["cn_zhao_gao_s1"]},{"dimension":"adaptation","score":75,"confidence":"inferred","fact":"逼迫二世自杀后，他尝试自行掌权，遭群臣反对便改立子婴。","inference":"既定安排受阻时会迅速更换路径。","limitation":"史书记述的细节及子婴身份存在不同记载；仅采用改立这一行为。","sourceIds":["cn_zhao_gao_s1"]},{"dimension":"independence","score":75,"confidence":"inferred","fact":"他主导改变始皇死后的继承安排，后又逼迫二世退出。","inference":"在重要权力节点会推动自己的决定，不完全依从原有权威。","limitation":"这种判断独立伴随严重越权；不可将二者视作同一种美德。","sourceIds":["cn_zhao_gao_s1"]},{"dimension":"risk","score":100,"confidence":"inferred","fact":"改写继承安排、清除大臣并迫使在位皇帝死亡，均带来巨大反噬风险。","inference":"多次进入不可轻易回撤的权力行动，支持高风险接受画像。","limitation":"风险有相当部分由他人承担，不能解释为个人勇敢。","sourceIds":["cn_zhao_gao_s1"]}],"sources":[{"id":"cn_zhao_gao_s1","title":"《史记》卷87《李斯列传》及附赵高","url":"https://zh.wikisource.org/zh-hans/史記/卷087"}],"historyNote":"《史记》记录其篡改继承安排、严刑与迫害；匹配只比较处事结构，不认可其行为，也不采用神异叙述作证。","reminder":{"dimension":"control","pole":"high","text":"把关键节点握在手里，也要让别人有提出不同意见的入口。"},"profileStatus":"editorial"},{"id":"cn_dong_zhuo","name":"董卓","group":"china","era":"东汉末年","role":"军阀、东汉相国","recognition":"率军进入洛阳，并主导废少帝、立献帝的权力人物。","keywords":["当面定调","强势推进","临场变招"],"portrait":"董卓更常把态度和力量直接摆到桌面上，希望迅速形成决定。他也会拉拢人、变换办法，并非只会蛮干。但靠强势推动的局面，往往容不下真实反馈；历史中的暴力与掠夺，让短期服从付出了极重代价。快与强，都需要接受边界约束。","profile":{"control":100,"influence":25,"horizon":75,"adaptation":75,"independence":100,"risk":100},"evidence":[{"dimension":"control","score":100,"confidence":"inferred","fact":"入洛后兼并何进等部曲，并在朝会上主导废立，威胁反对者。","inference":"关键人事与军政决定集中于自己，处于集中决策端。","limitation":"不能由政变时期的军事强制推广到所有私人关系。","sourceIds":["cn_dong_zhuo_s1"]},{"dimension":"influence","score":25,"confidence":"inferred","fact":"讨论废立时，他在百官面前直接提出主张并公开施压。","inference":"重大议程常由直接表态启动，而不是先达成广泛私下共识。","limitation":"入洛前后也使用私下收编和拉拢，故不设为完全公开端。","sourceIds":["cn_dong_zhuo_s1"]},{"dimension":"horizon","score":75,"confidence":"inferred","fact":"《后汉书》记其在郿筑坞储粮，将其作为进取不成后的退守安排。","inference":"明确准备长期退路与储备，支持较长的布局跨度。","limitation":"筑坞不等于有完整治国规划，史书所载储粮年数也不作为精确测量。","sourceIds":["cn_dong_zhuo_s1"]},{"dimension":"adaptation","score":75,"confidence":"inferred","fact":"兵少时以夜出晨入造成增兵假象；早年被围又利用筑堰掩护撤军。","inference":"在手段上能随局部条件调整，支持较高的变通定位。","limitation":"军事计谋的灵活不证明他愿意听取政策批评。","sourceIds":["cn_dong_zhuo_s1"]},{"dimension":"independence","score":100,"confidence":"inferred","fact":"百官反对废立时仍继续推进，强迫太后接受。","inference":"在重大冲突中坚持自己的方案，而非寻求多数认可。","limitation":"这里包含强制和暴力，不能等同平等讨论中的独立。","sourceIds":["cn_dong_zhuo_s1"]},{"dimension":"risk","score":100,"confidence":"inferred","fact":"以有限兵力入朝后迅速兼并军队并更换皇帝。","inference":"选择可能引发全面反抗的不可逆行动，风险接受明显较高。","limitation":"不能把其造成的他人风险写成值得效仿的胆量。","sourceIds":["cn_dong_zhuo_s1"]}],"sources":[{"id":"cn_dong_zhuo_s1","title":"《后汉书》卷72《董卓列传》","url":"https://zh.wikisource.org/wiki/後漢書/卷72"}],"historyNote":"采用《后汉书》记载的政治与军事行动；不采用《三国演义》的虚构桥段，保留其暴力统治的真实伤害。","reminder":{"dimension":"influence","pole":"low","text":"直接表达能省去绕路，但给别人一点准备时间，意见更容易被听进去。"},"profileStatus":"editorial"},{"id":"cn_li_linfu","name":"李林甫","group":"china","era":"唐玄宗时期","role":"唐朝宰相","recognition":"长期任相，通过宫廷关系、人事安排和议程控制维护地位。","keywords":["先探动向","慢筑屏障","谨慎守位"],"portrait":"李林甫通常先摸清关键人的倾向，再决定何时开口、怎样安排。他把位置维护成一层层关系和程序，行动细密而缓慢。这种画像能让人想到先观察、再出手的节奏，也提醒人：如果所有安排都只服务于保住位置，真实问题就会被隔在门外。","profile":{"control":100,"influence":100,"horizon":100,"adaptation":null,"independence":25,"risk":25},"evidence":[{"dimension":"control","score":100,"confidence":"inferred","fact":"传记记其排斥不由自己门路进用者，并长期掌握重要人事议程。","inference":"对关键人事入口集中把关，支持集中决策的高端。","limitation":"人事排斥不等于所有行政事务都由他亲自处理。","sourceIds":["cn_li_linfu_s1"]},{"dimension":"influence","score":100,"confidence":"inferred","fact":"他结交宫廷近侍，预知皇帝动向；多次私下协助或阻碍人事任命。","inference":"先获取内部信息、协调关键关系，再提出安排的路径清楚。","limitation":"不能把普通人的事前沟通等同于其秘密排挤行为。","sourceIds":["cn_li_linfu_s1"]},{"dimension":"horizon","score":100,"confidence":"inferred","fact":"韦坚、王忠嗣等事件及长期人事排斥构成连续的保位安排。","inference":"维护位置并非单次应急，而是长期、多环节的防护结构。","limitation":"长期有效不代表结果良好，也不证明其所有步骤预先设计。","sourceIds":["cn_li_linfu_s2"]},{"dimension":"adaptation","score":null,"confidence":"unknown","fact":"围绕储位及相关官员，他在多次受阻后仍持续排斥对手，其间也调整具体手段。","inference":"目标持续与方法调整可以并存；现有概括不足以判断他遇到新情况时调整方法的倾向，暂不评分。","limitation":"不能用保位目标长期不变替代对具体方法、反馈和调整速度的观察。","sourceIds":["cn_li_linfu_s2"]},{"dimension":"independence","score":25,"confidence":"inferred","fact":"进奏前常探知玄宗意向，在张九龄争议中避免公开与皇帝相左。","inference":"与最高决策者保持一致，是其公开处事的常见方式。","limitation":"对其他大臣他十分强势，低分不表示没有自己的目的。","sourceIds":["cn_li_linfu_s1"]},{"dimension":"risk","score":25,"confidence":"inferred","fact":"传记写其深阻保位，晚年加强居处防护并频繁更换寝处。","inference":"对自身暴露和安全保持高度防范，偏向控制可见风险。","limitation":"生活防护与政治风险并不等价，只作为保位行动的补充证据。","sourceIds":["cn_li_linfu_s1"]}],"sources":[{"id":"cn_li_linfu_s1","title":"《旧唐书》卷106《李林甫传》","url":"https://zh.wikisource.org/wiki/舊唐書/卷106"},{"id":"cn_li_linfu_s2","title":"《新唐书》卷223上《李林甫传》","url":"https://zh.wikisource.org/wiki/新唐書/卷223上"}],"historyNote":"两部唐书都有强烈的道德评价，具体行为可参考，内心动机只能谨慎概括；也保留其死后遭杨国忠诬构的记载。","reminder":{"dimension":"risk","pole":"low","text":"留好退路很有用，也可以为值得尝试的小事设一个可承受的试错额度。"},"profileStatus":"editorial"},{"id":"cn_yang_guozhong","name":"杨国忠","group":"china","era":"唐玄宗时期","role":"唐朝宰相、财政官员","recognition":"杨贵妃的族兄，曾兼掌财政职务，后成为安史之乱前的重要执政者。","keywords":["把握机会","快速扩张","短线反应"],"portrait":"杨国忠的经历呈现出很快接住机会、迅速扩大职责的节奏。他善于调动现成关系，也容易把眼前的竞争推到必须分出高下的程度。映照到日常，这是一种行动快、反馈也想要快的画像；但每次都追着局势加速，可能来不及看清后续成本。","profile":{"control":75,"influence":50,"horizon":25,"adaptation":75,"independence":50,"risk":75},"evidence":[{"dimension":"control","score":75,"confidence":"inferred","fact":"兼领多项财政职务后，他又借案件排除与其分权的王鉷等人。","inference":"倾向将关键资源和职责集中到自己的安排之下。","limitation":"兼任官职本身不是性格证据，主要依据主动排除分权者。","sourceIds":["cn_yang_guozhong_s1"]},{"dimension":"influence","score":50,"confidence":"inferred","fact":"他依靠宫廷关系取得信息，也公开奏劾对手、推动人事变动。","inference":"私下联络与直接进奏都有实例，影响路径暂置中段。","limitation":"这表示渠道并用，不能解读为他在所有场合都内外兼顾。","sourceIds":["cn_yang_guozhong_s1"]},{"dimension":"horizon","score":25,"confidence":"inferred","fact":"与安禄山、哥舒翰相关的应对多围绕即时威胁和眼前责任展开。","inference":"材料中的主要决策较强调迅速解除当前压力。","limitation":"《旧唐书》有归咎倾向，不能仅凭最终失败断定缺乏远见。","sourceIds":["cn_yang_guozhong_s1"]},{"dimension":"adaptation","score":75,"confidence":"inferred","fact":"早期依附李林甫的政治网络，权势上升后转而削弱其亲近者。","inference":"随着力量关系变化，合作路径发生明显调整。","limitation":"利益转向不等于日常遇到新证据时的开放态度。","sourceIds":["cn_yang_guozhong_s1"]},{"dimension":"independence","score":50,"confidence":"inferred","fact":"他常探知玄宗好恶而进奏，也主动借案件推动自己的竞争目标。","inference":"对上协调与自行推动目标并存，因此取中段。","limitation":"不能将亲族背景或官位高低直接换算为独立性。","sourceIds":["cn_yang_guozhong_s1"]},{"dimension":"risk","score":75,"confidence":"inferred","fact":"他持续强化与安禄山等人的对抗，并推动高风险军事处置。","inference":"面临不确定局面时，仍倾向主动加码而非限制行动范围。","limitation":"具体责任有史学争议，不能据此断言所有失误都由他造成。","sourceIds":["cn_yang_guozhong_s1"]}],"sources":[{"id":"cn_yang_guozhong_s1","title":"《旧唐书》卷106《杨国忠传》","url":"https://zh.wikisource.org/wiki/舊唐書/卷106"}],"historyNote":"人物资料以正史政治行动为依据，不使用马嵬相关戏剧情节推断人格；避免把安史之乱归因于单个人的性格。","reminder":{"dimension":"horizon","pole":"low","text":"当下有进展之后，留一点时间检查：这一步会把下一步带到哪里。"},"profileStatus":"editorial"},{"id":"cn_qin_hui","name":"秦桧","group":"china","era":"南宋前期","role":"南宋宰相","recognition":"长期推动宋金和议，并参与排斥异己与岳飞冤案。","keywords":["锁定路线","幕后协调","压低波动"],"portrait":"秦桧后期的政治路径，是把一个既定方向持续推进，再用人事和议程维护它。他重视局面可控，也擅长先处理关键关系。这样的处事结构容易让人看到稳定与持续的一面，但排除反对意见并不能消除现实风险；听不见异议，往往正是问题的起点。","profile":{"control":100,"influence":75,"horizon":75,"adaptation":25,"independence":50,"risk":25},"evidence":[{"dimension":"control","score":100,"confidence":"inferred","fact":"他推动同相分任内外、设修政局并自行提举，又持续排除政敌。","inference":"通过制度安排与人事处理收拢决策入口，集中性明显。","limitation":"画像主要概括其南宋执政时期，不能倒推早期所有行为。","sourceIds":["cn_qin_hui_s1"]},{"dimension":"influence","score":75,"confidence":"inferred","fact":"关于接收金方文书与礼仪安排，他先同多位官员私下商议折中路径。","inference":"较多通过事前协商处理阻力，然后使决定落地。","limitation":"这些协商不能与迫害政敌混为同一性质。","sourceIds":["cn_qin_hui_s1"]},{"dimension":"horizon","score":75,"confidence":"inferred","fact":"长期维护和议方向，并通过人事安排稳定这条政治路线。","inference":"有持续维护同一政策框架的跨度，而非只处理单一事件。","limitation":"维持多年不证明他预见了所有后果。","sourceIds":["cn_qin_hui_s1"]},{"dimension":"adaptation","score":25,"confidence":"inferred","fact":"金方内部变化及反对者警告出现后，他仍坚持既有和议路线。","inference":"在已建立的方向上持续推进，调整意愿偏低。","limitation":"早年反对割地、后来主和体现过转变；该画像特指后期执政。","sourceIds":["cn_qin_hui_s1"]},{"dimension":"independence","score":50,"confidence":"inferred","fact":"早年在割地争议中持反对意见；后期和议政策又与高宗取向相合。","inference":"资料显示坚持异议与顺应最高决策者均存在，取中段。","limitation":"不同生命阶段不能简化为一条不变的性格。","sourceIds":["cn_qin_hui_s1"]},{"dimension":"risk","score":25,"confidence":"inferred","fact":"后期反对韩世忠乘隙进攻等主张，优先维持和议与现有秩序。","inference":"政策选择更强调避免公开军事升级，偏向控制可见波动。","limitation":"主和并不自动等于低风险，和议本身同样有战略风险。","sourceIds":["cn_qin_hui_s1"]}],"sources":[{"id":"cn_qin_hui_s1","title":"《宋史》卷473《秦桧传》","url":"https://zh.wikisource.org/zh-hant/宋史/卷473"},{"id":"cn_qin_hui_s2","title":"《宋史》卷474《万俟卨传》","url":"https://zh.wikisource.org/zh/宋史/卷474"}],"historyNote":"匹配不为其迫害行为辩护；《宋史》记岳飞案中秦桧与万俟卨等人的作用。对主和政策与冤案责任分别叙述。","reminder":{"dimension":"adaptation","pole":"low","text":"坚持一个方向时，也预先约定哪些新情况值得让你重新评估。"},"profileStatus":"editorial"},{"id":"cn_cai_jing","name":"蔡京","group":"china","era":"北宋后期","role":"北宋宰相、书法家","recognition":"在宋徽宗时期多次任相，参与财政、教育与官制等改革。","keywords":["制度布局","切换路径","资源统筹"],"portrait":"蔡京的画像更接近用一套制度推动事情的人：调配人员、改变流程，再把多个领域串起来。他也能迅速适应政策风向。放到日常，这让人想到善于搭框架、愿意整合资源的做法；但框架越大，越要留意实际使用者的负担，不能只追求方案顺畅。","profile":{"control":100,"influence":75,"horizon":100,"adaptation":100,"independence":25,"risk":75},"evidence":[{"dimension":"control","score":100,"confidence":"inferred","fact":"设讲议司并自任提举，重要政事由该机构及其所用官员筹划。","inference":"主动组织一个集中议程的决策中心，而非仅凭相位推断。","limitation":"在中心之下仍按事务分工，集中并不等于亲自做所有事。","sourceIds":["cn_cai_jing_s1"]},{"dimension":"influence","score":75,"confidence":"inferred","fact":"失势居杭州时，通过童贯输送书画及相关意见，使皇帝重新注意到他。","inference":"借关键关系先建立认可，再回到正式决策位置。","limitation":"书画往来不自动等于政治操纵，依据在于传记明确记述的荐引链。","sourceIds":["cn_cai_jing_s1"]},{"dimension":"horizon","score":100,"confidence":"inferred","fact":"改革涉及教育、茶盐、财政与官制，并以专门机构持续推进。","inference":"跨领域和制度层面的安排支持较长的布局跨度。","limitation":"跨度长不意味着方案合理，改革的伤害需要单独评估。","sourceIds":["cn_cai_jing_s1"]},{"dimension":"adaptation","score":100,"confidence":"inferred","fact":"先迅速落实司马光恢复差役，后来又推动章惇恢复雇役。","inference":"在方向相反的政策间快速切换，有清楚的行为实例。","limitation":"这种政策顺应不能直接解释成对新知识的开放。","sourceIds":["cn_cai_jing_s1"]},{"dimension":"independence","score":25,"confidence":"inferred","fact":"两次执行不同执政者的役法，并以徽宗的绍述意向作为政治依据。","inference":"在正式立场上经常随最高权力的政策取向调整。","limitation":"其具体制度设计有主动性，低分不等于没有主见或能力。","sourceIds":["cn_cai_jing_s1"]},{"dimension":"risk","score":75,"confidence":"inferred","fact":"重改盐钞、茶法及货币等安排，影响已有持有者与市场关系。","inference":"愿意推动覆盖面大、后果不确定的制度变化。","limitation":"大量风险由社会承担，不能把制度冒进美化为个人勇敢。","sourceIds":["cn_cai_jing_s1"]}],"sources":[{"id":"cn_cai_jing_s1","title":"《宋史》卷472《蔡京传》","url":"https://zh.wikisource.org/wiki/宋史/卷472"}],"historyNote":"《宋史》同时提供政策行动与负面评价；采用行动作为画像依据，保留盐钞等改革给民众造成损失的记载。","reminder":{"dimension":"horizon","pole":"high","text":"构想一整套办法时，先让最受影响的人试用其中的一小步。"},"profileStatus":"editorial"},{"id":"cn_tong_guan","name":"童贯","group":"china","era":"北宋后期","role":"宦官、军政统帅","recognition":"长期掌握军事事务，参与西北战争、平定方腊与联金攻辽。","keywords":["抢先推进","跨场调度","敢于押注"],"portrait":"童贯的经历里，行动常走在充分共识之前：既能借关系获得支持，也会直接把任务压到前线。他在不同战场之间调度资源，愿意押上较大的机会。这样的推进力需要真实反馈作支撑；如果不允许坏消息回来，行动再快，也容易把判断带偏。","profile":{"control":75,"influence":50,"horizon":75,"adaptation":75,"independence":75,"risk":75},"evidence":[{"dimension":"control","score":75,"confidence":"inferred","fact":"在西北选置将吏时直接取皇帝旨意，不经常规朝廷程序，并组织亲军。","inference":"把重要人事和行动安排集中在自己可直接控制的渠道。","limitation":"战时统帅权限具有制度背景，不能完全归因个人偏好。","sourceIds":["cn_tong_guan_s1"]},{"dimension":"influence","score":50,"confidence":"inferred","fact":"一面通过蔡京与宫廷关系取得任用，一面直接向将领下令推进战事。","inference":"私下联络和当面指挥同样突出，暂置中段。","limitation":"前线命令与日常社交表达不同，不能解释为外向程度。","sourceIds":["cn_tong_guan_s1"]},{"dimension":"horizon","score":75,"confidence":"inferred","fact":"出使辽后荐马植，参与组织攻燕计划与人员兵力准备。","inference":"对未来目标有跨阶段筹备，较强调提前调度资源。","limitation":"筹备存在并不表示计划可行或考虑周全。","sourceIds":["cn_tong_guan_s1"]},{"dimension":"adaptation","score":75,"confidence":"inferred","fact":"攻燕兵力准备期间因方腊起事改向东南，平定后再回到北方战事。","inference":"会因局势变化重新配置行动路径。","limitation":"任务转向也受朝廷命令影响，不全是个人自主选择。","sourceIds":["cn_tong_guan_s1"]},{"dimension":"independence","score":75,"confidence":"inferred","fact":"西北出兵时未依皇帝临时停止行动的手札撤回，而继续军事行动。","inference":"有在权威指令变化后仍推动自己判断的明确记录。","limitation":"违令不是独立性的正面榜样，也不能代表日常所有决定。","sourceIds":["cn_tong_guan_s1"]},{"dimension":"risk","score":75,"confidence":"inferred","fact":"多次深入西北用兵，又推动攻燕；但金军南下时选择撤离太原。","inference":"常接受较大军事不确定性，也有避险反例，因此不用极端值。","limitation":"统帅把风险分配给部下，不能等同个人承担同等风险。","sourceIds":["cn_tong_guan_s1"]}],"sources":[{"id":"cn_tong_guan_s1","title":"《宋史》卷468《宦者三·童贯》","url":"https://www.shidianguji.com/book/LS0020/chapter/LS0020_2114"}],"historyNote":"传记既记其军事经历，也记其隐瞒败绩、滥用权力与撤离；不把战事中的杀伤包装成可供模仿的性格优势。","reminder":{"dimension":"risk","pole":"high","text":"愿意尝试之前，先确认失败的成本由谁承担、有没有停下来的条件。"},"profileStatus":"editorial"},{"id":"cn_gao_qiu","name":"高俅","group":"china","era":"北宋后期","role":"掌管禁军的高级武官","recognition":"历史上确有其人；《水浒传》中的大量情节不能直接当作他的生平。","keywords":["近臣关系","禁军履历","史料有限"],"portrait":"高俅不能只用《水浒传》里的反派形象来理解。史料能确认他受徽宗信任、长期担任禁军要职，也留下了对其军政的批评；另有宋人笔记记他照顾苏氏后人。现有材料不足以可靠补齐六维，因此保留人物资料，不把小说情节填进性格评分。","profile":{"control":null,"influence":75,"horizon":null,"adaptation":null,"independence":null,"risk":null},"evidence":[{"dimension":"control","score":null,"confidence":"unknown","fact":"《宋史》记其掌军及受到军政失当的批评。","inference":"这些材料不能确定他如何在团队内分配决策权限。","limitation":"官位高和管理结果差，都不足以确定决策集中程度。","sourceIds":["cn_gao_qiu_s1"]},{"dimension":"influence","score":75,"confidence":"inferred","fact":"宋人笔记叙述他由王诜进入端王身边、随后受到持续亲近。","inference":"现存晋身叙述偏向私人关系与近距离接触的影响路径。","limitation":"记载属于后出的笔记，无法证明其全部政治行动均采取同一路径。","sourceIds":["cn_gao_qiu_s2"]},{"dimension":"horizon","score":null,"confidence":"unknown","fact":"材料记录其长期任职，但未提供足够的连续规划过程。","inference":"不能从任职年数推导布局跨度。","limitation":"长时间在位并不等于主动长期规划。","sourceIds":["cn_gao_qiu_s1","cn_gao_qiu_s2"]},{"dimension":"adaptation","score":null,"confidence":"unknown","fact":"《挥麈后录》记其随徽宗南下后以病辞归。","inference":"无法确认疾病情况及决策动机，不据此给策略调整分数。","limitation":"单次返回京师不能证成灵活或顽固。","sourceIds":["cn_gao_qiu_s2"]},{"dimension":"independence","score":null,"confidence":"unknown","fact":"材料记录其受宠与任职，没有充分呈现意见分歧时的具体选择。","inference":"无法判断意见独立性的稳定倾向。","limitation":"受皇帝信任本身不表示完全顺从。","sourceIds":["cn_gao_qiu_s1","cn_gao_qiu_s2"]},{"dimension":"risk","score":null,"confidence":"unknown","fact":"现有可核实材料未给出足够的风险权衡与备选行动。","inference":"不把其后来善终解释成低风险偏好。","limitation":"结果幸运或不幸都不是风险接受的直接测量。","sourceIds":["cn_gao_qiu_s2"]}],"sources":[{"id":"cn_gao_qiu_s1","title":"《宋史》卷446《李若水传》","url":"https://www.shidianguji.com/book/LS0020/chapter/LS0020_1664"},{"id":"cn_gao_qiu_s2","title":"王明清《挥麈后录》卷7，高俅条","url":"https://www.shidianguji.com/book/SBCK368/chapter/1km622yg2v2fd"}],"historyNote":"资料库保留已确认人物；本版六维证据不足，缺项不能被解释为中等性格。结果须显示资料状态，并说明缺项采用的保守比较规则。不采用高衙内、林冲等小说情节补分。","reminder":{"dimension":"influence","pole":"high","text":"熟悉的关系能打开沟通，但重要决定也值得留下清楚、可核对的依据。"},"profileStatus":"incomplete"},{"id":"cn_jia_sidao","name":"贾似道","group":"china","era":"南宋后期","role":"南宋宰相","recognition":"长期主持南宋后期政务，推行公田等财政措施。","keywords":["方案主导","维持框架","集中调度"],"portrait":"贾似道倾向抓住整体安排，希望财政、人事与军事都沿着自己认可的框架运转。他会提出成套方案，也会竭力维护方案的连续性。这种画像容易对应喜欢统筹的人；需要警惕的是，当解释越来越多、反馈越来越少，维护方案可能盖过了解决问题。","profile":{"control":100,"influence":75,"horizon":75,"adaptation":25,"independence":75,"risk":50},"evidence":[{"dimension":"control","score":100,"confidence":"inferred","fact":"对未先向他汇报的将领产生嫌隙，并通过核查军费等方式处理相关人员。","inference":"材料显示其要求关键行动进入自己的决策渠道。","limitation":"正史对其动机的描述含评价，主要采用汇报与处置事实。","sourceIds":["cn_jia_sidao_s1"]},{"dimension":"influence","score":75,"confidence":"inferred","fact":"鄂州战事期间遣人私下议和；入朝后又借相关官员处理政敌。","inference":"重大事项中多次先借少数中 :"依附权力不等于在所有问题上没有自己的主张。","sourceIds":["zhang","hejin"]},{"dimension":"risk","score":75,"confidence":"inferred","fact":"听闻何进要求诛杀宦官后，参与设伏并杀害何进。","inference":"威胁升级时采取了后果难以收回的行动。","limitation":"这是生存压力下的选择，不能推成轻松情境的冒险偏好。","sourceIds":["hejin"]}],"sources":[{"id":"zhang","title":"《后汉书》卷七十八·宦者列传","url":"https://zh.wikisource.org/wiki/後漢書/卷78"},{"id":"hejin","title":"《后汉书》卷六十九·何进传","url":"https://zh.wikisource.org/wiki/後漢書/卷69"}],"historyNote":"张让的宫廷影响伴随征敛与政治暴力。人物卡呈现的是记载中的行动路径，不采用影视中的夸张形象。","reminder":{"dimension":"influence","pole":"high","text":"私下沟通之后，把最终依据公开说清，能减少别人对你意图的猜测。"}},{"id":"cn_huang_hao","name":"黄皓","group":"china","era":"三国·蜀汉","role":"宫廷宦官","recognition":"刘禅身边的宦官；董允在世时受其约束，后来参与朝政并与姜维发生冲突。","keywords":["依托熟人","看准时机","先保退路"],"portrait":"黄皓的经历显示，他更依靠熟悉的人和近身关系寻找位置。有约束时收敛，支持自己的条件出现后再扩大影响；真正遇到个人危机，又会寻找缓和与脱身的办法。这样做容易守住眼前，却也可能只听见让自己安心的消息。","profile":{"control":75,"influence":100,"horizon":null,"adaptation":75,"independence":25,"risk":25},"evidence":[{"dimension":"control","score":75,"confidence":"inferred","fact":"陈祗死后黄皓进一步掌握权柄，并与阎宇谋求替换姜维。","inference":"希望影响关键职位与朝廷决定。","limitation":"其正式权限与实际介入程度并不完全相同。","sourceIds":["huang39","huang44"]},{"dimension":"influence","score":100,"confidence":"inferred","fact":"与陈祗互相配合，借刘禅的信任影响宫廷事务。","inference":"优先依靠关系近、能直接接触的人传递意见。","limitation":"亲近渠道是制度位置，也不全是性格选择。","sourceIds":["huang39"]},{"dimension":"horizon","score":null,"confidence":"unknown","fact":"曾阻止就魏军动向提前布防；但其一般筹划方式记载很少。","inference":"无法区分缺乏长线安排、误判情报与有意拖延。","limitation":"单次军事误判不足以给稳定布局跨度打分。","sourceIds":["huang44"]},{"dimension":"adaptation","score":75,"confidence":"inferred","fact":"董允在世时不敢放纵；更换宫廷核心人物后参与政事，败局中又贿赂求免。","inference":"会随约束和支持条件变化调整自身做法。","limitation":"职位变化也改变了行动空间，因此仅作有限推断。","sourceIds":["huang39"]},{"dimension":"independence","score":25,"confidence":"inferred","fact":"与姜维对立，但在刘禅要求后仍向姜维陈谢，并依靠宫廷支持推进事务。","inference":"主要权威要求缓和时，会调整自己的对外行动。","limitation":"这不表示他事事服从，也不能把依附当作合作能力。","sourceIds":["huang39","huang44"]},{"dimension":"risk","score":25,"confidence":"inferr 只在幕后处理。","sourceIds":["richelieu_france"]},{"dimension":"horizon","score":75,"confidence":"inferred","fact":"政策由国内权力整合延伸到持续的欧洲外交与战争安排。","inference":"多个阶段围绕长期政治目标衔接，支持较长布局倾向。","limitation":"《政治遗嘱》含事后总结，不能证明每一步事先都已预定。","sourceIds":["richelieu_france"]},{"dimension":"adaptation","score":75,"confidence":"documented","fact":"他从倾向天主教阵营合作，转为联合新教力量对抗哈布斯堡势力。","inference":"政治条件与目标改变时，愿意调整合作关系。","limitation":"这一调整不意味着他放弃宗教信仰；不能把宗教与政治关系混为一谈。","sourceIds":["richelieu_france"]},{"dimension":"independence","score":50,"confidence":"inferred","fact":"他顶住虔敬派的反对推动方案，同时依赖国王同意并与其合作。","inference":"对部分群体坚持己见，对最高决策者保持协作，采用混合倾向。","limitation":"不能因服务国王就判为低自主，也不能把盟友反对视为所有群体意见。","sourceIds":["richelieu_france","richelieu_oxford"]},{"dimension":"risk","score":75,"confidence":"inferred","fact":"法国由间接介入三十年战争转为1635年公开对西班牙作战。","inference":"愿意为既定目标承担扩大冲突带来的不确定性。","limitation":"这项决策属于国家政治并造成重大社会代价，不能美化成个人勇气。","sourceIds":["richelieu_france"]}],"sources":[{"id":"richelieu_france","title":"France Mémoire：Richelieu principal ministre de Louis XIII，历史学家 Françoise Hildesheimer 撰","url":"https://www.france-memoire.fr/richelieu-principal-ministre-de-louis-xiii/"},{"id":"richelieu_oxford","title":"Oxford Bibliographies：Cardinal Richelieu，史学评价综述","url":"https://academic.oup.com/reference/62416/reference-article-abstract/555937124"},{"id":"richelieu_minister","title":"A. Lloyd Moote：Richelieu As Chief Minister，收于《Richelieu and his Age》（Oxford，1992），章节摘要","url":"https://academic.oup.com/book/47912/chapter-abstract/422355808"}],"historyNote":"其战争与财政政策带来沉重负担，也伴随镇压。人物解读不采用大仲马小说情节，也不把治理能力写成对伤害的辩护。","reminder":{"dimension":"horizon","pole":"high","text":"大方向之外，定期问一句谁正在承担这一步的代价；把反馈留进计划，长期目标才不会压过眼前的人。"}},{"id":"world_rasputin","name":"拉斯普京","group":"world","era":"1869—1916 · 俄国","role":"宗教人物、沙皇家庭的私人顾问","recognition":"与俄国末代沙皇家庭关系密切，通过私下建议影响宫廷事务，并非常规任职大臣。","keywords":["私人沟通","关系影响","反对冒进"],"portrait":"拉斯普京没有常规大臣的职位，却通过持续的私人谈话和宫廷联系影响事务。他的故事提醒人：影响力有时来自被信任，也可能在关系过近时模糊边界。这里能观察到他的沟通路径，却不能仅凭神秘传闻，把他写成洞悉一切或总有完整计划的人。","profile": ds":["brutus_plutarch","brutus_met"]}],"sources":[{"id":"brutus_plutarch","title":"普鲁塔克《布鲁图斯传》，Loeb 公版英译，芝加哥大学网站转录","url":"https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Brutus*.html"},{"id":"brutus_met","title":"大都会艺术博物馆：布鲁图斯银币与刺杀凯撒背景","url":"https://www.metmuseum.org/art/collection/search/259194"}],"historyNote":"古代传记写于事件之后，含作者的道德评价及不可靠传说。本画像只取有明确事件背景的行为，不使用鬼魂故事、戏剧台词或父子关系传说。","reminder":{"dimension":"independence","pole":"high","text":"坚持自己的理由时，也再问一次对方可能怎样回应；立场想清楚了，仍要给现实的反应留位置。"}}]}</script>
  <script>(function (root, factory) {

  function scoreAnswers(answers, questions) {

    const raw = Object.fromEntries(DIMENSIONS.map(id => [id, []]));

      dimensions[id] = {
        score: 100 * total / 12,
        total, raw: raw[id],
        spread: Math.max(...raw[id]) - Math.min(...raw[id]),

        // six-dimension denominator; use its largest possible squared gap.
        // This is an upper bound, never a fabricated midpoint or free match.

  function dimensionWord(dim, score) {

  function tendencyText(dim, value, mixed) {

  function examplesFor(id, scores, answers, questions) {

    if (scores[id].mixed) {

      long:'在这些日常选择里，你没有一直偏向同一种做法。表达意见、面对变化、决定下一步时，你会看具体处境再作判断。再看看下面三位人物的故事，哪些地方让你觉得熟悉。',

    const descriptions={
      control:{low:'愿意给别人留出决定的空间',high:'亲自把握重要决定会让你更安心'},
      influence:{low:'有想法时，你更愿意先摆到大家面前说',high:'比起当众发起讨论，你更习惯先私下聊清楚'},
      horizon:{low:'你习惯先走好眼前的一步',high:'还没走到下一步，你常常已经多想了几步'},
      adaptation:{low:'面对变化，你愿意再观察一会儿',high:'情形变了，你也愿意较快调整做法'},
      independence:{low:'你愿意向大家共同认可的方向靠近',high:'别人的意见很热闹，你仍会留住自己的判断'},
      risk:{low:'遇到新机会，你会先给自己留一条退路',high:'有吸引力的机会出现时，你愿意接受一些不确定'}
    };

      stability:withStability?stabilityFor(answers,data,pool,ranking):null,

  }
  function restoreState(value, data) {
    if(!value||value.version!==data.version||!Array.isArray(value.answers)||value.answers.length!==data.questions.length) return null;

    const index=clamp(Number.isInteger(value.index)?value.index:0,0,data.questions.length-1);
    const complete=answers.every(x=>Number.isInteger(x));
    const view=value.view==='result'&&complete?'result':value.view==='quiz'?'quiz':'cover';
    return {answers,index,pool:'all',view,version:data.version};
  }
  return {DIMENSIONS,band,scoreAnswers,comparePerson,rankPeople,explanationFor,overallText,resultFor,restoreState};
});
